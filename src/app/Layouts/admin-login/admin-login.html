<main dir="rtl" class="grid min-h-screen place-items-center bg-[#0b0b0a] px-5 font-sans text-[#f5ead6]">
  <section class="w-full max-w-md rounded-2xl border border-[#4b3b27] bg-[#15130f] p-6 shadow-2xl sm:p-8">
    <div class="text-center">
      <img class="mx-auto h-16 w-28 object-contain mix-blend-screen" src="logo.png" alt="RoyalRide">
      <span class="text-[10px] font-bold tracking-[0.2em] text-[#d8b66e]">ROYALRIDE CONTROL</span>
      <h1 class="mt-3 text-2xl font-black text-white">دخول الإدارة</h1>
      <p class="mt-2 text-xs text-[#a9987d]">هذه الصفحة مخصصة للمشرف فقط</p>
    </div>

    <form class="mt-7 grid gap-4" (ngSubmit)="submit()">
      <label class="grid gap-2 text-xs font-bold text-[#c9b998]">البريد الإلكتروني<input name="email" type="email" required autocomplete="username" [ngModel]="email()" (ngModelChange)="email.set($event)" class="rounded-md border border-[#4b3b27] bg-[#0f0e0c] px-3 py-3 text-sm text-white outline-none focus:border-[#d4ad67]"></label>
      <label class="grid gap-2 text-xs font-bold text-[#c9b998]">كلمة المرور<input name="password" type="password" required autocomplete="current-password" [ngModel]="password()" (ngModelChange)="password.set($event)" class="rounded-md border border-[#4b3b27] bg-[#0f0e0c] px-3 py-3 text-sm text-white outline-none focus:border-[#d4ad67]"></label>
      @if (error()) { <p class="rounded-md border border-red-800/70 bg-red-950/40 px-3 py-2 text-xs text-red-200">{{ error() }}</p> }
      <button type="submit" [disabled]="loading()" class="rounded-md bg-[#d4ad67] px-4 py-3 text-sm font-black text-[#21180d] transition hover:bg-[#edc77f] disabled:cursor-wait disabled:opacity-60">{{ loading() ? 'جارٍ التحقق...' : 'دخول لوحة التحكم' }}</button>
    </form>
  </section>
</main>
